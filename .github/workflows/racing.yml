name: Australian Racing Strategy 4.1 - Top Ten

on:
  workflow_dispatch:
    inputs:
      race_date:
        description: 'Australian racing date (YYYY-MM-DD); blank means tomorrow in Sydney'
        required: false
        type: string
  schedule:
    # UK 21:30 is UTC 20:30 in BST and UTC 21:30 in GMT.
    - cron: '30 20,21 * * *'

permissions:
  contents: read

concurrency:
  group: australian-racing-strategy41
  cancel-in-progress: false

jobs:
  racing:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Choose racing date and UK scheduled run
        id: dates
        shell: bash
        env:
          MANUAL_DATE: ${{ inputs.race_date }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == 'schedule' ]]; then
            uk_clock="$(TZ=Europe/London date +%H:%M)"
            if [[ "$uk_clock" != '21:30' ]]; then
              echo 'run_report=false' >> "$GITHUB_OUTPUT"
              echo "Skipped because UK clock is $uk_clock"
              exit 0
            fi
          fi
          echo 'run_report=true' >> "$GITHUB_OUTPUT"
          if [[ -n "$MANUAL_DATE" ]]; then
            if [[ ! "$MANUAL_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || \
               [[ "$(date -d "$MANUAL_DATE" +%F 2>/dev/null)" != "$MANUAL_DATE" ]]; then
              echo 'Invalid date: use YYYY-MM-DD' >&2
              exit 1
            fi
            race_date="$MANUAL_DATE"
          else
            race_date="$(TZ=Australia/Sydney date -d tomorrow +%F)"
          fi
          echo "race_date=$race_date" >> "$GITHUB_OUTPUT"
          echo "Racing date: $race_date"

      - name: Install collector dependencies
        if: steps.dates.outputs.run_report == 'true'
        run: python -m pip install -r requirements.txt

      - name: Check Python scripts
        if: steps.dates.outputs.run_report == 'true'
        run: python -m py_compile collect_racing.py collect_runners.py score_racing.py send_telegram.py

      - name: Collect Australian race programme
        if: steps.dates.outputs.run_report == 'true'
        run: |
          python collect_racing.py --date '${{ steps.dates.outputs.race_date }}' --output data

      - name: Collect runners and historical starts
        if: steps.dates.outputs.run_report == 'true'
        run: |
          python collect_runners.py --date '${{ steps.dates.outputs.race_date }}' --output data

      - name: Validate collection completeness
        if: steps.dates.outputs.run_report == 'true'
        env:
          RACE_DATE: ${{ steps.dates.outputs.race_date }}
        shell: bash
        run: |
          python - <<'PY'
          import csv, json, os
          from pathlib import Path
          folder = Path('data') / os.environ['RACE_DATE']
          programme = json.loads((folder / 'manifest.json').read_text())
          runners = json.loads((folder / 'runners_manifest.json').read_text())
          requested = int(programme.get('race_link_count', 0))
          if requested <= 0:
              raise SystemExit('No races collected; Telegram send blocked')
          if programme.get('unknown'):
              raise SystemExit('Unparsed meeting rows; coverage cannot be trusted')
          if runners.get('errors') or runners.get('races_collected') != requested:
              raise SystemExit('Incomplete runner collection; Telegram send blocked')
          for filename in ('races.csv', 'runners.csv', 'past_starts.csv'):
              path = folder / filename
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f'Missing or empty {path}')
          with (folder / 'runners.csv').open(newline='', encoding='utf-8') as f:
              actual_races = {(r['date'], r['state'], r['meeting'], r['race']) for r in csv.DictReader(f)}
          if len(actual_races) != requested:
              raise SystemExit(f'Race coverage mismatch: {len(actual_races)} of {requested}')
          print(f'Validated {requested} collected races; scratchings remain unverified')
          PY

      - name: Score Strategy 4.1 and rank top ten
        if: steps.dates.outputs.run_report == 'true'
        run: |
          python score_racing.py --date '${{ steps.dates.outputs.race_date }}' --input data --output reports

      - name: Preview Telegram report
        if: steps.dates.outputs.run_report == 'true'
        run: |
          python send_telegram.py --date '${{ steps.dates.outputs.race_date }}' --reports reports --dry-run

      - name: Upload diagnostics and reports
        if: always() && steps.dates.outputs.run_report == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: racing-strategy41-${{ steps.dates.outputs.race_date }}
          path: |
            data/${{ steps.dates.outputs.race_date }}/manifest.json
            data/${{ steps.dates.outputs.race_date }}/runners_manifest.json
            reports/${{ steps.dates.outputs.race_date }}/
          if-no-files-found: warn
          retention-days: 30

      - name: Send Strategy 4.1 top ten to Telegram
        if: steps.dates.outputs.run_report == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python send_telegram.py --date '${{ steps.dates.outputs.race_date }}' --reports reports
