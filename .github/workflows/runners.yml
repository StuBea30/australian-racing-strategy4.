
name: Test Racing Runner Collection and Scoring

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect-and-score:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Collect racing programme
        run: |
          python collect_racing.py \
            --date 2026-10-18 \
            --output data

      - name: Collect runners and historical form
        run: |
          python collect_runners.py \
            --date 2026-10-18 \
            --output data

      - name: Score all runners using Strategy 4.0
        run: |
          python score_racing.py \
            --date 2026-10-18 \
            --input data \
            --output reports

      - name: Display provisional top three
        run: |
          cat reports/2026-10-18/top_three_provisional.md

      - name: Upload racing data and scoring reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: racing-strategy4-scoring-test
          path: |
            data/
            reports/
          retention-days: 7
