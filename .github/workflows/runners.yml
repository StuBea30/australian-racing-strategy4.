
name: Test Racing Runner Collection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect-runners:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Collect racing programme
        run: |
          python collect_racing.py \
            --date 2026-10-18 \
            --output data

      - name: Collect runners and form for ALL races
        run: |
          python collect_runners.py \
            --date 2026-10-18 \
            --output data

      - name: Upload all collected racing data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: racing-runner-test
          path: data/
          retention-days: 7
