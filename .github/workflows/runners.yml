
name: Australian Racing Strategy 4.0 - Daily Automation

on:
  workflow_dispatch:
  schedule:
    # 21:30 UK time in winter (GMT)
    - cron: "30 21 * * *"

    # 21:30 UK time in summer (BST)
    - cron: "30 20 * * *"

permissions:
  contents: read

concurrency:
  group: australian-racing-strategy4-daily
  cancel-in-progress: false

jobs:
  collect-score-report:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      TZ: Europe/London
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check UK schedule and calculate racing date
        id: racing_date
        shell: bash
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo

          london = ZoneInfo("Europe/London")
          now = datetime.now(timezone.utc).astimezone(london)

          manual = os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch"

          # Two UTC schedules are needed because GitHub cron
          # does not automatically adjust for British Summer Time.
          #
          # Only the run that falls in the 21:30 UK local-time
          # window is allowed to continue.
          #
          # GitHub scheduled jobs may start several minutes late.

          correct_window = (
              now.hour == 21
              and now.minute >= 30
          )

          should_run = manual or correct_window

          tomorrow = (now + timedelta(days=1)).date()
          racing_date = tomorrow.isoformat()

          print("Current UK time:", now.isoformat())
          print("Racing date:", racing_date)
          print("Manual run:", manual)
          print("Run permitted:", should_run)

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"date={racing_date}\n")
              output.write(
                  f"should_run={'true' if should_run else 'false'}\n"
              )
          PY

      - name: Checkout repository
        if: steps.racing_date.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.racing_date.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        if: steps.racing_date.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Collect tomorrow's racing programme
        if: steps.racing_date.outputs.should_run == 'true'
        run: |
          python collect_racing.py \
            --date "${{ steps.racing_date.outputs.date }}" \
            --output data

      - name: Collect all runners and historical form
        if: steps.racing_date.outputs.should_run == 'true'
        run: |
          python collect_runners.py \
            --date "${{ steps.racing_date.outputs.date }}" \
            --output data

      - name: Score every runner using Strategy 4.0
        if: steps.racing_date.outputs.should_run == 'true'
        run: |
          python score_racing.py \
            --date "${{ steps.racing_date.outputs.date }}" \
            --input data \
            --output reports

      - name: Display top three in GitHub Actions
        if: steps.racing_date.outputs.should_run == 'true'
        run: |
          cat "reports/${{ steps.racing_date.outputs.date }}/top_three_provisional.md"

      - name: Publish report to GitHub Actions summary
        if: steps.racing_date.outputs.should_run == 'true'
        shell: bash
        run: |
          REPORT="reports/${{ steps.racing_date.outputs.date }}/top_three_provisional.md"

          echo "## Australian Racing Strategy 4.0" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Racing date: ${{ steps.racing_date.outputs.date }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -f "$REPORT" ]; then
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No completed scoring report available." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload racing data and reports
        if: always() && steps.racing_date.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: racing-strategy4-${{ steps.racing_date.outputs.date }}-${{ github.run_number }}
          path: |
            data/
            reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Explain skipped duplicate schedule
        if: steps.racing_date.outputs.should_run != 'true'
        run: |
          echo "This scheduled trigger is outside the UK 21:30 window."
          echo "Skipping to avoid duplicate daily processing."
