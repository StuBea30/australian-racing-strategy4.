
name: Australian Racing Strategy 4.0 - Telegram Report

on:
  workflow_dispatch:

  schedule:
    # 9:30pm UK winter time (GMT)
    - cron: "30 21 * * *"

    # 9:30pm UK summer time (BST)
    - cron: "30 20 * * *"

permissions:
  contents: read

concurrency:
  group: australian-racing-strategy4-daily
  cancel-in-progress: false

jobs:
  collect-score-send:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      TZ: Europe/London
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Calculate racing date and UK schedule
        id: racing_date
        shell: bash
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo

          london = ZoneInfo("Europe/London")
          now = datetime.now(timezone.utc).astimezone(london)

          manual = (
              os.environ.get("GITHUB_EVENT_NAME")
              == "workflow_dispatch"
          )

          # GitHub cron runs in UTC.
          # Two triggers cover GMT and BST.
          # Only the appropriate UK evening run proceeds.
          #
          # A scheduled run delayed into the next UK hour
          # is allowed until 22:29 local time.

          scheduled_window = (
              (now.hour == 21 and now.minute >= 30)
              or now.hour == 22 and now.minute < 30
          )

          should_run = manual or scheduled_window

          racing_date = (
              now + timedelta(days=1)
          ).date().isoformat()

          print("Current UK time:", now.isoformat())
          print("Racing date:", racing_date)
          print("Manual run:", manual)
          print("Run permitted:", should_run)

          with open(
              os.environ["GITHUB_OUTPUT"], "a"
          ) as output:
              output.write(
                  f"date={racing_date}\n"
              )
              output.write(
                  "should_run="
                  + ("true" if should_run else "false")
                  + "\n"
              )
          PY

      - name: Checkout repository
        if: steps.racing_date.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.racing_date.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        if: steps.racing_date.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Collect Australian racing programme
        if: steps.racing_date.outputs.should_run == 'true'
        run: |
          python collect_racing.py \
            --date "${{ steps.racing_date.outputs.date }}" \
            --output data

      - name: Collect all runners and historical form
        if: steps.racing_date.outputs.should_run == 'true'
        run: |
          python collect_runners.py \
            --date "${{ steps.racing_date.outputs.date }}" \
            --output data

      - name: Score all runners using Strategy 4.0
        if: steps.racing_date.outputs.should_run == 'true'
        run: |
          python score_racing.py \
            --date "${{ steps.racing_date.outputs.date }}" \
            --input data \
            --output reports

      - name: Publish report to GitHub summary
        if: steps.racing_date.outputs.should_run == 'true'
        shell: bash
        run: |
          REPORT="reports/${{ steps.racing_date.outputs.date }}/top_three_provisional.md"

          echo "## Australian Racing Strategy 4.0" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Racing date: ${{ steps.racing_date.outputs.date }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -f "$REPORT" ]; then
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report available." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Send racing selections to Telegram
        if: steps.racing_date.outputs.should_run == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python send_telegram.py \
            --date "${{ steps.racing_date.outputs.date }}" \
            --reports reports

      - name: Upload racing data and reports
        if: always() && steps.racing_date.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: racing-strategy4-${{ steps.racing_date.outputs.date }}-${{ github.run_number }}
          path: |
            data/
            reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Explain skipped schedule
        if: steps.racing_date.outputs.should_run != 'true'
        run: |
          echo "Outside the UK evening processing window."
          echo "Skipping this scheduled trigger."
