
name: Football Strategy 3.0 - Historical Backtest

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install requests numpy scipy
      - name: Run walk-forward backtest
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python football_backtest.py --min-training 70 --days-between-fits 7
      - name: Upload backtest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-backtest-results
          path: |
            football_backtest_results.json
            football_backtest_predictions.csv
          if-no-files-found: warn
