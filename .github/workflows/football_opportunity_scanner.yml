name: Football Strategy 3.0 - Telegram Top Three

on:
  workflow_dispatch:
  schedule:
    # 08:30 UK: 08:30 UTC in winter, 07:30 UTC in summer.
    # Two daily UTC triggers; choose the correct slot by trigger expression,
    # not runner start time (GitHub schedules can be delayed).
    - cron: '23 7 * * *'
    - cron: '23 8 * * *'

permissions:
  contents: read

jobs:
  football-top-three:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install requests numpy scipy
      - name: Select UK schedule slot
        id: timecheck
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          now = datetime.now(timezone.utc)
          local = now.astimezone(ZoneInfo('Europe/London'))
          # Use the scheduled UTC slot instead of the delayed execution hour.
          winter = local.utcoffset().total_seconds() == 0
          expected = "23 8 * * *" if winter else "23 7 * * *"
          allowed = os.environ['EVENT_NAME'] == 'workflow_dispatch' or os.environ.get('SCHEDULE_CRON') == expected
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'run={str(allowed).lower()}\n')
          print(f'Scheduled cron: {os.environ.get("SCHEDULE_CRON")}; actual UTC start: {now.isoformat()}; UK: {local}; expected: {expected}; execute: {allowed}')
          PY
      - name: Generate fresh football probabilities
        if: steps.timecheck.outputs.run == 'true'
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python football_model.py --days 2
      - name: Find qualifying bets and send Telegram
        if: steps.timecheck.outputs.run == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python football_opportunity_scanner.py --send --max-credits 12
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-opportunity-audit
          path: |
            football_probabilities.json
            football_opportunities.json
          if-no-files-found: ignore
