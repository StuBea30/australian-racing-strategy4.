
name: Strategy 4.1 Prize Money Live Probe

on:
  workflow_dispatch:
    inputs:
      racing_date:
        description: "Australian racing date YYYY-MM-DD"
        required: true
        default: "2026-11-07"
        type: string
      race_limit:
        description: "Number of races to test"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Collect racing programme
        run: |
          python collect_racing.py \
            --date "${{ inputs.racing_date }}" \
            --output data

      - name: Collect historical runner data
        continue-on-error: true
        run: |
          python collect_runners.py \
            --date "${{ inputs.racing_date }}" \
            --output data \
            --limit "${{ inputs.race_limit }}" \
            --delay 0

      - name: Audit prize money
        if: always()
        run: |
          python audit_live_purses.py \
            --date "${{ inputs.racing_date }}" \
            --output data

      - name: Upload diagnostic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prize-money-live-probe
          path: data/
          retention-days: 7
          if-no-files-found: warn
