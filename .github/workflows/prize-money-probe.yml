
name: Strategy 4.1 - Prize Money and Scoring Test

on:
  workflow_dispatch:
    inputs:
      racing_date:
        description: "Australian race date (YYYY-MM-DD); blank = next Sydney date"
        required: false
        type: string
      race_limit:
        description: "Number of races to test (1-5)"
        required: false
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"

permissions:
  contents: read

jobs:
  strategy41_test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile \
            collect_racing.py \
            collect_runners.py \
            purse_data.py \
            track_states.py \
            prize_grading.py \
            score_racing.py

      - name: Validate prize-money thresholds
        run: |
          python - <<'PY'
          import json
          from prize_grading import validate_minima

          with open("purse_thresholds.json", encoding="utf-8") as f:
              config = json.load(f)

          minima = validate_minima(
              config["standard_minima_aud"]
          )

          print("Configured standard AUD thresholds:", minima)
          print("WA, SA and TAS receive a 15% reduction.")
          PY

      - name: Run targeted grading tests
        run: |
          python -m unittest test_prize_grading -v

      - name: Resolve Australian racing date
        id: date
        env:
          REQUESTED_DATE: ${{ inputs.racing_date }}
        run: |
          python - <<'PY'
          import datetime
          import os
          from zoneinfo import ZoneInfo

          requested = os.environ.get(
              "REQUESTED_DATE", ""
          ).strip()

          if requested:
              datetime.date.fromisoformat(requested)
              date = requested
          else:
              today = datetime.datetime.now(
                  ZoneInfo("Australia/Sydney")
              ).date()
              date = (
                  today + datetime.timedelta(days=1)
              ).isoformat()

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8"
          ) as f:
              f.write(f"date={date}\n")

          print("Testing Australian race date:", date)
          PY

      - name: Collect race programme
        run: |
          python collect_racing.py \
            --date "${{ steps.date.outputs.date }}" \
            --output data

      - name: Collect runner histories
        run: |
          python collect_runners.py \
            --date "${{ steps.date.outputs.date }}" \
            --output data \
            --limit "${{ inputs.race_limit }}" \
            --delay 0

      - name: Audit collected prize money
        if: always()
        run: |
          python audit_live_purses.py \
            --date "${{ steps.date.outputs.date }}" \
            --output data

      - name: Run Strategy 4.1 scoring
        run: |
          python score_racing.py \
            --date "${{ steps.date.outputs.date }}" \
            --input data \
            --output reports \
            --purse-thresholds purse_thresholds.json

      - name: Check scoring outputs
        run: |
          python - <<'PY'
          import csv
          import os
          from pathlib import Path

          date = os.environ["RACING_DATE"]
          folder = Path("reports") / date

          required = [
              "all_runner_scores.csv",
              "race_rankings.csv",
              "top_ten_provisional.csv",
              "top_three_provisional.csv",
              "scoring_manifest.json",
              "top_three_provisional.md",
          ]

          missing = [
              name for name in required
              if not (folder / name).is_file()
          ]

          if missing:
              raise SystemExit(
                  "Missing scoring outputs: "
                  + ", ".join(missing)
              )

          with (folder / "all_runner_scores.csv").open(
              newline="", encoding="utf-8"
          ) as f:
              runners = list(csv.DictReader(f))

          with (folder / "race_rankings.csv").open(
              newline="", encoding="utf-8"
          ) as f:
              rankings = list(csv.DictReader(f))

          print("Runners scored:", len(runners))
          print("Eligible race rankings:", len(rankings))

          if not runners:
              raise SystemExit(
                  "FAIL: No runner scores were produced."
              )

          if not rankings:
              raise SystemExit(
                  "FAIL: No eligible race rankings. "
                  "Inspect class, prize-money and "
                  "evidence coverage."
              )

          print("Scoring output check passed.")
          PY
        env:
          RACING_DATE: ${{ steps.date.outputs.date }}

      - name: Upload diagnostic and scoring reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy41-prize-money-scoring-test
          path: |
            data/
            reports/
          retention-days: 7
          if-no-files-found: warn
