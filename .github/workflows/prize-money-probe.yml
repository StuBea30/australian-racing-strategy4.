
      - name: Select Flemington Race 7
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          path = Path("data/${{ inputs.racing_date }}/races.csv")

          with path.open(newline="", encoding="utf-8") as f:
              rows = list(csv.DictReader(f))
              columns = list(rows[0]) if rows else []

          selected = [
              r for r in rows
              if r["meeting"].strip().lower() == "flemington"
              and str(r["race"]).strip() == "7"
          ]

          if len(selected) != 1:
              raise SystemExit(
                  f"Expected one Flemington R7; found {len(selected)}"
              )

          with path.open("w", newline="", encoding="utf-8") as f:
              writer = csv.DictWriter(f, fieldnames=columns)
              writer.writeheader()
              writer.writerows(selected)

          print("Selected Flemington Race 7")
          PY
